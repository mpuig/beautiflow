<title id="beautiflow-03-plugin-class-model-a7db282e-title">03 plugin class model</title>
<desc id="beautiflow-03-plugin-class-model-a7db282e-desc">03 plugin class model, rendered as a class diagram.</desc>
<rect width="100%" height="100%" fill="#eff1f5" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  .mono { font-family: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, monospace; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #4c4f69;
    --_text-sec:      var(--muted, color-mix(in srgb, #4c4f69 60%, #eff1f5));
    --_text-muted:    var(--muted, color-mix(in srgb, #4c4f69 40%, #eff1f5));
    --_text-faint:    color-mix(in srgb, #4c4f69 25%, #eff1f5);
    --_line:          var(--line, color-mix(in srgb, #4c4f69 50%, #eff1f5));
    --_arrow:         var(--accent, color-mix(in srgb, #4c4f69 85%, #eff1f5));
    --_node-fill:     var(--surface, color-mix(in srgb, #4c4f69 3%, #eff1f5));
    --_node-stroke:   var(--border, color-mix(in srgb, #4c4f69 20%, #eff1f5));
    --_group-fill:    #eff1f5;
    --_group-hdr:     color-mix(in srgb, #4c4f69 5%, #eff1f5);
    --_inner-stroke:  color-mix(in srgb, #4c4f69 12%, #eff1f5);
    --_key-badge:     color-mix(in srgb, #4c4f69 10%, #eff1f5);
  }
</style>
