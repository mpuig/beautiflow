<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 679.7030000000001 470" width="679.7030000000001" height="470" style="--bg:#282a36;--fg:#f8f8f2;--line:#6272a4;--accent:#bd93f9;--muted:#6272a4;background:#282a36">
<rect width="100%" height="100%" fill="#282a36" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #f8f8f2;
    --_text-sec:      var(--muted, color-mix(in srgb, #f8f8f2 60%, #282a36));
    --_text-muted:    var(--muted, color-mix(in srgb, #f8f8f2 40%, #282a36));
    --_text-faint:    color-mix(in srgb, #f8f8f2 25%, #282a36);
    --_line:          var(--line, color-mix(in srgb, #f8f8f2 50%, #282a36));
    --_arrow:         var(--accent, color-mix(in srgb, #f8f8f2 85%, #282a36));
    --_node-fill:     var(--surface, color-mix(in srgb, #f8f8f2 3%, #282a36));
    --_node-stroke:   var(--border, color-mix(in srgb, #f8f8f2 20%, #282a36));
    --_group-fill:    #282a36;
    --_group-hdr:     color-mix(in srgb, #f8f8f2 5%, #282a36);
    --_inner-stroke:  color-mix(in srgb, #f8f8f2 12%, #282a36);
    --_key-badge:     color-mix(in srgb, #f8f8f2 10%, #282a36);
  }
</style>
