<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 538" width="440" height="538" style="--bg:#eceff4;--fg:#2e3440;--line:#aab1c0;--accent:#5e81ac;--muted:#7b88a1">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #2e3440;
    --_text-sec:      var(--muted, color-mix(in srgb, #2e3440 60%, #eceff4));
    --_text-muted:    var(--muted, color-mix(in srgb, #2e3440 40%, #eceff4));
    --_text-faint:    color-mix(in srgb, #2e3440 25%, #eceff4);
    --_line:          var(--line, color-mix(in srgb, #2e3440 50%, #eceff4));
    --_arrow:         var(--accent, color-mix(in srgb, #2e3440 85%, #eceff4));
    --_node-fill:     var(--surface, color-mix(in srgb, #2e3440 3%, #eceff4));
    --_node-stroke:   var(--border, color-mix(in srgb, #2e3440 20%, #eceff4));
    --_group-fill:    #eceff4;
    --_group-hdr:     color-mix(in srgb, #2e3440 5%, #eceff4);
    --_inner-stroke:  color-mix(in srgb, #2e3440 12%, #eceff4);
    --_key-badge:     color-mix(in srgb, #2e3440 10%, #eceff4);
  }
</style>
<defs>
  <marker id="seq-arrow" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polygon points="0 0, 8 2.5, 0 5" fill="#5e81ac" />
  </marker>
  <marker id="seq-arrow-open" markerWidth="8" markerHeight="5" refX="8" refY="2.5" orient="auto-start-reverse">
    <polyline points="0 0, 8 2.5, 0 5" fill="none" stroke="#5e81ac" stroke-width="1" />
  </marker>
</defs>
<g class="block" data-type="alt" data-label="Conflict detected">
  <rect x="30" y="186" width="380" height="204" rx="0" ry="0" fill="none" stroke="#c6cad0" stroke-width="1" />
  <rect x="30" y="186" width="123.25" height="18" fill="#e3e6eb" stroke="#c6cad0" stroke-width="1" />
  <text x="36" y="195" font-size="11" font-weight="600" fill="#7b88a1" dy="3.8499999999999996">alt [Conflict detected]</text>
  <line x1="30" y1="302" x2="410" y2="302" stroke="#aab1c0" stroke-width="0.75" stroke-dasharray="6 4" />
  <text x="38" y="316" font-size="11" text-anchor="start" font-weight="400" fill="#7b88a1" dy="3.8499999999999996">[Revisions compatible]</text>
</g>
<g class="block" data-type="opt" data-label="Battery is low">
  <rect x="30" y="398" width="100" height="60" rx="0" ry="0" fill="none" stroke="#c6cad0" stroke-width="1" />
  <rect x="30" y="398" width="110.71000000000002" height="18" fill="#e3e6eb" stroke="#c6cad0" stroke-width="1" />
  <text x="36" y="407" font-size="11" font-weight="600" fill="#7b88a1" dy="3.8499999999999996">opt [Battery is low]</text>
</g>
<g class="block" data-type="loop" data-label="While local changes remain">
  <rect x="30" y="78" width="380" height="380" rx="0" ry="0" fill="none" stroke="#c6cad0" stroke-width="1" />
  <rect x="30" y="78" width="189.91000000000003" height="18" fill="#e3e6eb" stroke="#c6cad0" stroke-width="1" />
  <text x="36" y="87" font-size="11" font-weight="600" fill="#7b88a1" dy="3.8499999999999996">loop [While local changes remain]</text>
</g>
<line class="lifeline" data-actor="Device" x1="80" y1="70" x2="80" y2="508" stroke="#aab1c0" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Sync" x1="220" y1="70" x2="220" y2="508" stroke="#aab1c0" stroke-width="0.75" stroke-dasharray="6 4" />
<line class="lifeline" data-actor="Cloud" x1="360" y1="70" x2="360" y2="508" stroke="#aab1c0" stroke-width="0.75" stroke-dasharray="6 4" />
<g class="message" data-from="Device" data-to="Sync" data-label="Submit next change set" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="80" y1="118" x2="220" y2="118" stroke="#aab1c0" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="150" y="108" font-size="11" text-anchor="middle" font-weight="400" fill="#7b88a1" dy="3.8499999999999996">Submit next change set</text>
</g>
<g class="message" data-from="Sync" data-to="Cloud" data-label="Compare revision vector" data-line-style="solid" data-arrow-head="filled" data-self="false">
  <line x1="220" y1="158" x2="360" y2="158" stroke="#aab1c0" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="290" y="148" font-size="11" text-anchor="middle" font-weight="400" fill="#7b88a1" dy="3.8499999999999996">Compare revision vector</text>
</g>
<g class="message" data-from="Cloud" data-to="Sync" data-label="Return conflicting fields" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="360" y1="226" x2="220" y2="226" stroke="#aab1c0" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="290" y="216" font-size="11" text-anchor="middle" font-weight="400" fill="#7b88a1" dy="3.8499999999999996">Return conflicting fields</text>
</g>
<g class="message" data-from="Sync" data-to="Device" data-label="Request user resolution" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="220" y1="266" x2="80" y2="266" stroke="#aab1c0" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="150" y="256" font-size="11" text-anchor="middle" font-weight="400" fill="#7b88a1" dy="3.8499999999999996">Request user resolution</text>
</g>
<g class="message" data-from="Cloud" data-to="Sync" data-label="Commit accepted" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="360" y1="330" x2="220" y2="330" stroke="#aab1c0" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="290" y="320" font-size="11" text-anchor="middle" font-weight="400" fill="#7b88a1" dy="3.8499999999999996">Commit accepted</text>
</g>
<g class="message" data-from="Sync" data-to="Device" data-label="Advance local cursor" data-line-style="dashed" data-arrow-head="filled" data-self="false">
  <line x1="220" y1="370" x2="80" y2="370" stroke="#aab1c0" stroke-width="1" stroke-dasharray="6 4" marker-end="url(#seq-arrow)" />
  <text x="150" y="360" font-size="11" text-anchor="middle" font-weight="400" fill="#7b88a1" dy="3.8499999999999996">Advance local cursor</text>
</g>
<g class="message" data-from="Device" data-to="Device" data-label="Pause background sync" data-line-style="solid" data-arrow-head="filled" data-self="true">
  <polyline points="80,438 110,438 110,458 80,458" fill="none" stroke="#aab1c0" stroke-width="1" marker-end="url(#seq-arrow)" />
  <text x="118" y="448" font-size="11" text-anchor="start" font-weight="400" fill="#7b88a1" dy="3.8499999999999996">Pause background sync</text>
</g>
<g class="actor" data-id="Device" data-label="Device" data-type="participant">
  <rect x="40" y="30" width="80" height="40" rx="4" ry="4" fill="#e6e9ef" stroke="#c6cad0" stroke-width="1" />
  <text x="80" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="#2e3440" dy="4.55">Device</text>
</g>
<g class="actor" data-id="Sync" data-label="Sync" data-type="participant">
  <rect x="180" y="30" width="80" height="40" rx="4" ry="4" fill="#e6e9ef" stroke="#c6cad0" stroke-width="1" />
  <text x="220" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="#2e3440" dy="4.55">Sync</text>
</g>
<g class="actor" data-id="Cloud" data-label="Cloud" data-type="participant">
  <rect x="320" y="30" width="80" height="40" rx="4" ry="4" fill="#e6e9ef" stroke="#c6cad0" stroke-width="1" />
  <text x="360" y="50" font-size="13" text-anchor="middle" font-weight="500" fill="#2e3440" dy="4.55">Cloud</text>
</g>
</svg>