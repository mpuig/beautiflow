<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
  text { font-family: 'Inter', system-ui, sans-serif; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          #1f2328;
    --_text-sec:      var(--muted, color-mix(in srgb, #1f2328 60%, #ffffff));
    --_text-muted:    var(--muted, color-mix(in srgb, #1f2328 40%, #ffffff));
    --_text-faint:    color-mix(in srgb, #1f2328 25%, #ffffff);
    --_line:          var(--line, color-mix(in srgb, #1f2328 50%, #ffffff));
    --_arrow:         var(--accent, color-mix(in srgb, #1f2328 85%, #ffffff));
    --_node-fill:     var(--surface, color-mix(in srgb, #1f2328 3%, #ffffff));
    --_node-stroke:   var(--border, color-mix(in srgb, #1f2328 20%, #ffffff));
    --_group-fill:    #ffffff;
    --_group-hdr:     color-mix(in srgb, #1f2328 5%, #ffffff);
    --_inner-stroke:  color-mix(in srgb, #1f2328 12%, #ffffff);
    --_key-badge:     color-mix(in srgb, #1f2328 10%, #ffffff);
  }
</style>
