name: Bug report
description: Report reproducible incorrect behavior
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the Mermaid source and exact Beautiflow command when possible.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Beautiflow version
      placeholder: beautiflow 0.6.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS arm64, Linux x64, etc.
    validations:
      required: true
