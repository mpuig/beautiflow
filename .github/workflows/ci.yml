name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - run: bun install --frozen-lockfile
      - run: bun run validate
      - name: Standalone smoke test
        run: |
          ./dist/beautiflow version
          ./dist/beautiflow render examples/recipes/aws-architecture/sources/step-6-production-architecture.mmd --format svg --output /tmp/beautiflow-architecture.svg
          test -s /tmp/beautiflow-architecture.svg
